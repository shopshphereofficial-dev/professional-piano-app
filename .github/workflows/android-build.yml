name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoMaster-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Piano Master Pro v1.0.0
          draft: false
          prerelease: false
          body: |
            ## Piano Master Professional v1.0.0

            Enjoy the full concert grand piano experience directly on your Android device!

            ### Key Features:
            - **Full 88-Key Keyboard**: Multi-touch support with realistic touch physics and quick octave slider navigation.
            - **Studio Audio Engines**: Acoustic Grand Piano, Rhodes Electric Piano, Church Organ, and Synth Pad.
            - **Dual-Row Split Keyboard**: Play bass line and melody simultaneously across two independent octave rows.
            - **Performance Recorder**: Record your original pieces in real-time and replay with illuminated keys.
            - **Interactive Song Library**: Practice Beethoven's Für Elise, Ode to Joy, Pachelbel's Canon in D, and Twinkle Twinkle with interactive guide modes.
            - **Studio Metronome & Sustain Pedal**: Precision timing with tap tempo and acoustic sustain pedal emulation.
            - **Reverb & Tuning Modes**: Scientific pitch notation (C4) and Solfege (Do-Re-Mi) options with concert hall acoustics.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
