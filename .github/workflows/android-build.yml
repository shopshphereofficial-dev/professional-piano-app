name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoMaster-v1.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Piano Master Pro v1.1.0 - Extended Bollywood & Indian Piano Edition
          draft: false
          prerelease: false
          body: |
            ## Piano Master Pro v1.1.0 - Bollywood & Indian Piano Edition

            ### What's New:
            - **30+ Full Indian & Bollywood Piano Melodies**:
              - Tum Hi Ho (Aashiqui 2)
              - Agar Tum Saath Ho (Tamasha)
              - Apna Bana Le (Bhediya)
              - Heeriye (Jasleen Royal)
              - O Maahi (Dunki)
              - Sajni (Laapataa Ladies)
              - Chaleya (Jawan)
              - Hawayein (Jab Harry Met Sejal)
              - Kaise Hua (Kabir Singh)
              - Tujhe Kitna Chahne Lage (Kabir Singh)
              - Phir Bhi Tumko Chaahunga
              - Ve Maahi (Kesari)
              - Khairiyat (Chhichhore)
              - Ishq Wala Love
              - Samjhawan
              - Pehli Dafa
              - Tera Ban Jaunga
              - Humnava Mere
              - Kaise Mujhe (Ghajini)
              - Iktara (Wake Up Sid)
              - Iraaday & Bikhra (Abdul Hannan)
              - Husn, Jo Tum Mere Ho, Alag Aasmaan (Anuv Jain)
              - Maan Meri Jaan (King)
              - Satranga (Animal)
              - Ve Kamleya
              - Tere Vaaste
              - Marjaavan Tune & Classics (Für Elise, Canon in D)
            - **Extended 30–60+ Second Arrangements**: Detailed verses, hooks, and choruses with dual-hand / octave-adapted notes.
            - **Interactive Practice & Auto-Play Modes**: Watch glowing keys play each song or practice with visual note indicators.
            - **Full 88-Key Concert Keyboard**: Multi-touch polyphony, 4 instrument sounds, metronome & sustain pedal.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
