<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Piano Master Pro - Bollywood & Indian Hits Edition</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-bg: #14161f;
    --panel-border: #242838;
    --accent-gold: #f5b041;
    --accent-gold-hover: #f39c12;
    --accent-emerald: #2ecc71;
    --accent-cyan: #00d2d3;
    --accent-red: #ff4757;
    --key-white-bg: linear-gradient(180deg, #ffffff 0%, #f4f5f7 85%, #d8dde6 100%);
    --key-white-active: linear-gradient(180deg, #fffae6 0%, #f5b041 100%);
    --key-black-bg: linear-gradient(180deg, #2c2f38 0%, #15161b 75%, #050508 100%);
    --key-black-active: linear-gradient(180deg, #d35400 0%, #e67e22 100%);
    --text-main: #f0f2f8;
    --text-muted: #8b92a6;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
  }
  header {
    height: 48px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    z-index: 20;
    gap: 6px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--accent-gold);
    white-space: nowrap;
  }
  .nav-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1;
    justify-content: center;
    overflow-x: auto;
  }
  .btn {
    background: #1f2330;
    border: 1px solid #31364a;
    color: var(--text-main);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.active {
    background: var(--accent-gold);
    color: #111;
    border-color: var(--accent-gold-hover);
    font-weight: bold;
  }
  .btn-song-picker {
    background: linear-gradient(135deg, #e67e22, #f39c12);
    color: #fff;
    border: none;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(243, 156, 18, 0.4);
  }
  .btn-song-picker:hover { opacity: 0.95; }
  .select-styled {
    background: #1f2330;
    border: 1px solid #31364a;
    color: var(--text-main);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }
  .sub-bar {
    height: 38px;
    background: #10121a;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    z-index: 15;
  }
  .octave-shifter {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .octave-tag {
    font-family: monospace;
    font-size: 12px;
    color: var(--accent-gold);
    min-width: 46px;
    text-align: center;
    font-weight: bold;
  }
  .song-status-bar {
    display: none;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 420px;
    background: #171b26;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid #2b3145;
  }
  .song-status-bar.active {
    display: flex;
  }
  .song-title-text {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
  }
  .song-time {
    font-size: 10px;
    color: var(--text-muted);
    font-family: monospace;
  }
  .song-progress {
    flex: 1;
    height: 5px;
    background: #252a3a;
    border-radius: 3px;
    overflow: hidden;
  }
  .song-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-gold);
    transition: width 0.1s linear;
  }
  .piano-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .keys-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
    background: #090a0e;
    overflow-x: hidden;
  }
  .white-keys-container {
    display: flex;
    width: 100%;
    height: 100%;
  }
  .w-key {
    flex: 1;
    height: 100%;
    background: var(--key-white-bg);
    border-right: 1px solid #b8bec8;
    border-radius: 0 0 5px 5px;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.18), 0 2px 4px rgba(0,0,0,0.3);
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 8px;
    transition: background 0.05s, transform 0.04s;
    box-sizing: border-box;
  }
  .w-key:last-child { border-right: none; }
  .w-key.active, .w-key.guide-active {
    background: var(--key-white-active) !important;
    transform: translateY(2px);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.25), 0 0 12px rgba(245, 176, 65, 0.7);
  }
  .w-key.guide-active::after {
    content: '';
    position: absolute;
    top: 6px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-red);
    animation: ping 0.8s infinite alternate;
  }
  .b-key {
    position: absolute;
    top: 0;
    width: 2.8%;
    height: 60%;
    background: var(--key-black-bg);
    border-radius: 0 0 4px 4px;
    box-shadow: 2px 3px 6px rgba(0,0,0,0.6), inset 0 -2px 3px rgba(255,255,255,0.15);
    z-index: 5;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 6px;
    transition: background 0.05s, transform 0.04s;
  }
  .b-key.active, .b-key.guide-active {
    background: var(--key-black-active) !important;
    transform: translateY(2px);
    box-shadow: 0 0 14px rgba(230, 126, 34, 0.9);
  }
  .b-key.guide-active::after {
    content: '';
    position: absolute;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ffff;
    animation: ping 0.8s infinite alternate;
  }
  @keyframes ping {
    from { transform: scale(0.8); opacity: 0.6; }
    to { transform: scale(1.3); opacity: 1; }
  }
  .k-label {
    font-size: 11px;
    font-weight: 700;
    color: #444a59;
    pointer-events: none;
    line-height: 1.1;
    text-align: center;
  }
  .b-key .k-label {
    color: #abb2bf;
    font-size: 9px;
  }
  .sargam-label {
    font-size: 10px;
    font-weight: 800;
    color: #d35400;
  }
  .b-key .sargam-label {
    color: var(--accent-gold);
    font-size: 8px;
  }

  /* Modal Song Library Drawer */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open {
    display: flex;
  }
  .song-modal {
    background: #171924;
    border: 1px solid #2e3347;
    border-radius: 12px;
    width: 92vw;
    max-width: 760px;
    height: 88vh;
    max-height: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.8);
  }
  .modal-header {
    padding: 12px 16px;
    background: #1e2230;
    border-bottom: 1px solid #2e3347;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-close {
    background: #2b3145;
    border: none;
    color: #fff;
    font-size: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-filter-bar {
    padding: 8px 16px;
    background: #13151f;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid #222636;
    overflow-x: auto;
  }
  .filter-chip {
    background: #202434;
    border: 1px solid #2f354d;
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--accent-gold);
    color: #111;
    font-weight: bold;
    border-color: var(--accent-gold);
  }
  .song-search-box {
    padding: 8px 16px;
    background: #171924;
  }
  .song-search-input {
    width: 100%;
    background: #10121a;
    border: 1px solid #2a2e42;
    color: #fff;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
  }
  .song-list-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 16px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .song-card {
    background: #1f2333;
    border: 1px solid #2d334a;
    border-radius: 8px;
    padding: 9px 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .song-card:hover, .song-card:active {
    background: #272d42;
    border-color: var(--accent-gold);
    transform: translateY(-2px);
  }
  .song-card-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .song-card-sub {
    font-size: 11px;
    color: var(--text-muted);
  }
  .song-card-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--accent-gold);
  }
  .song-card-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .btn-card {
    flex: 1;
    padding: 4px 6px;
    font-size: 10px;
    border-radius: 4px;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-card-play {
    background: var(--accent-gold);
    color: #111;
  }
  .btn-card-learn {
    background: #2ecc71;
    color: #111;
  }
</style>
</head>
<body>
<div id="app">

<!-- Songs Library Modal -->
<div class="modal-overlay" id="modalSongLibrary">
  <div class="song-modal">
    <div class="modal-header">
      <h3>🎹 Indian Bollywood & Hits Song Library (30 Full Melodies)</h3>

    <div class="modal-filter-bar" id="modalFilters">
      <div class="filter-chip active" data-cat="all">All Songs (33)</div>

    <div class="song-search-box">
      <input type="text" class="song-search-input" id="songSearchInput" placeholder="Search song by name, movie, artist (e.g., Tum Hi Ho, Anuv Jain, Aashiqui, Dunki)...">
    </div>
    <div class="song-list-scroll" id="songListContainer">
      <!-- Song cards populated by JS -->
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIS ENGINE (Grand Piano, Rhodes, Organ, Strings)
   ========================================================================== */
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

let currentInstrument = 'grand';
let isSustainOn = false;
let labelMode = 'note'; // 'note', 'sargam', 'solfege', 'none'
let baseOctave = 4;     // Starting octave for white keys
let visibleWhiteKeys = 14; // Default visible keys (2 full octaves)

// Frequency table for MIDI 21 (A0) to 108 (C8)
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const SARGAM_NAMES = ['Sa', 're', 'Re', 'ga', 'Ga', 'Ma', 't-Ma', 'Pa', 'dha', 'Dha', 'ni', 'Ni'];
const SOLFEGE_NAMES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];

function noteToMidi(noteStr) {
  const m = noteStr.match(/^([A-G]#?)([0-8])$/);
  if (!m) return 60;
  const name = m[1];
  const oct = parseInt(m[2], 10);
  const idx = NOTE_NAMES.indexOf(name);
  return (oct + 1) * 12 + idx;
}

function midiToName(midi) {
  const name = NOTE_NAMES[midi % 12];
  const oct = Math.floor(midi / 12) - 1;
  return name + oct;
}

// Active voices tracking
const activeVoices = new Map();

function playNoteSound(midi, velocity = 0.8) {
  const ctx = getAudioContext();
  const freq = midiToFreq(midi);
  const now = ctx.currentTime;

  // Stop previous voice of same midi if still ringing
  if (activeVoices.has(midi)) {
    stopNoteSound(midi, true);
  }

  const masterGain = ctx.createGain();
  masterGain.connect(ctx.destination);

  const oscs = [];
  
  if (currentInstrument === 'grand') {
    // Concert Grand Piano: Fundamental + 2 harmonics + subtle strike detune
    const harmRatios = [1.0, 2.0, 3.0, 4.0];
    const harmAmps   = [1.0, 0.45, 0.18, 0.08];

    harmRatios.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq * ratio + (i === 1 ? 0.4 : 0), now);

      const amp = velocity * harmAmps[i] * 0.45;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(amp, now + 0.005);
      g.gain.exponentialRampToValueAtTime(amp * 0.35, now + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, now + (isSustainOn ? 4.5 : 1.8));

      osc.connect(g);
      g.connect(masterGain);
      osc.start(now);
      oscs.push(osc);
    });
  } else if (currentInstrument === 'rhodes') {
    // Electric Piano: Sine + Square bite
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2.0, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(velocity * 0.5, now + 0.008);
    g.gain.exponentialRampToValueAtTime(velocity * 0.15, now + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, now + (isSustainOn ? 4.0 : 1.4));

    osc1.connect(g);
    osc2.connect(g);
    g.connect(masterGain);
    osc1.start(now);
    osc2.start(now);
    oscs.push(osc1, osc2);
  } else if (currentInstrument === 'organ') {
    // Cathedral Organ: multiple rich harmonics, steady sustain
    [1, 2, 3, 4].forEach(mult => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * mult, now);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime((velocity * 0.22) / mult, now + 0.02);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now);
      oscs.push(osc);
    });
  } else {
    // Synth Strings: saw + detuned chorus
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 1.003, now);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, now);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(velocity * 0.25, now + 0.08);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    osc1.start(now);
    osc2.start(now);
    oscs.push(osc1, osc2);
  }

  activeVoices.set(midi, { masterGain, oscs, startTime: now });
}

function stopNoteSound(midi, force = false) {
  const voice = activeVoices.get(midi);
  if (!voice) return;
  
  if (isSustainOn && !force && currentInstrument !== 'organ' && currentInstrument !== 'strings') {
    // Sustain pedal holds the release
    return;
  }

  const ctx = getAudioContext();
  const now = ctx.currentTime;
  const releaseTime = force ? 0.05 : 0.22;
  try {
    voice.masterGain.gain.cancelScheduledValues(now);
    voice.masterGain.gain.setValueAtTime(voice.masterGain.gain.value, now);
    voice.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);
    setTimeout(() => {
      voice.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
      voice.masterGain.disconnect();
    }, releaseTime * 1000 + 50);
  } catch(e) {}
  activeVoices.delete(midi);
}

/* ==========================================================================
   KEYBOARD RENDERING & TOUCH ENGINE
   ========================================================================== */
const whiteKeysContainer = document.getElementById('whiteKeysContainer');
const keysWrapper = document.getElementById('keysWrapper');
const octaveTag = document.getElementById('octaveTag');

// We build a range of white keys and place black keys absolutely on top
let currentWhiteMidis = [];

function isMidiBlack(midi) {
  const n = midi % 12;
  return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
}

function getNoteLabel(midi) {
  if (labelMode === 'none') return '';
  const name = NOTE_NAMES[midi % 12];
  const oct = Math.floor(midi / 12) - 1;
  if (labelMode === 'sargam') {
    return `<span class="sargam-label">${SARGAM_NAMES[midi % 12]}</span>`;
  }
  if (labelMode === 'solfege') {
    return `${SOLFEGE_NAMES[midi % 12]}<br><small>${oct}</small>`;
  }
  return `${name}${oct}`;
}

function renderKeyboard() {
  whiteKeysContainer.innerHTML = '';
  // Remove all black keys
  const oldBlacks = keysWrapper.querySelectorAll('.b-key');
  oldBlacks.forEach(b => b.remove());

  // Start at baseOctave, C
  const startMidi = (baseOctave + 1) * 12; // C of baseOctave
  currentWhiteMidis = [];
  let midi = startMidi;
  
  while (currentWhiteMidis.length < visibleWhiteKeys) {
    if (!isMidiBlack(midi)) {
      currentWhiteMidis.push(midi);
    }
    midi++;
    if (midi > 108) break;
  }

  // Update octave display
  const firstKey = midiToName(currentWhiteMidis[0]);
  const lastKey = midiToName(currentWhiteMidis[currentWhiteMidis.length - 1]);
  octaveTag.textContent = `${firstKey}–${lastKey}`;

  // Render White Keys
  currentWhiteMidis.forEach((wMidi, index) => {
    const wKey = document.createElement('div');
    wKey.className = 'w-key';
    wKey.dataset.midi = wMidi;
    wKey.innerHTML = `<span class="k-label">${getNoteLabel(wMidi)}</span>`;
    whiteKeysContainer.appendChild(wKey);
  });

  // Place Black Keys dynamically over white key boundaries
  setTimeout(positionBlackKeys, 20);
}

function positionBlackKeys() {
  const oldBlacks = keysWrapper.querySelectorAll('.b-key');
  oldBlacks.forEach(b => b.remove());

  const whiteElements = whiteKeysContainer.querySelectorAll('.w-key');
  if (whiteElements.length === 0) return;
  const containerRect = keysWrapper.getBoundingClientRect();

  whiteElements.forEach((wKey, index) => {
    const wMidi = parseInt(wKey.dataset.midi, 10);
    const nextMidi = wMidi + 1;

    if (isMidiBlack(nextMidi)) {
      const bKey = document.createElement('div');
      bKey.className = 'b-key';
      bKey.dataset.midi = nextMidi;
      bKey.innerHTML = `<span class="k-label">${getNoteLabel(nextMidi)}</span>`;

      const wRect = wKey.getBoundingClientRect();
      const leftPos = (wRect.right - containerRect.left) - (containerRect.width * 0.015);
      const bWidth = containerRect.width * 0.038;

      bKey.style.left = `${leftPos - (bWidth / 2)}px`;
      bKey.style.width = `${Math.max(bWidth, 24)}px`;
      keysWrapper.appendChild(bKey);
    }
  });
}

window.addEventListener('resize', positionBlackKeys);

// Multi-Touch tracking system
const touchMap = new Map(); // touchId -> midi

function getKeyAtPoint(x, y) {
  // Check black keys first (higher z-index)
  const blackKeys = keysWrapper.querySelectorAll('.b-key');
  for (let bk of blackKeys) {
    const r = bk.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      return bk;
    }
  }
  const whiteKeys = keysWrapper.querySelectorAll('.w-key');
  for (let wk of whiteKeys) {
    const r = wk.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      return wk;
    }
  }
  return null;
}

function triggerNoteOn(midi) {
  playNoteSound(midi);
  const keyEl = keysWrapper.querySelector(`[data-midi="${midi}"]`);
  if (keyEl) keyEl.classList.add('active');
}

function triggerNoteOff(midi) {
  stopNoteSound(midi);
  const keyEl = keysWrapper.querySelector(`[data-midi="${midi}"]`);
  if (keyEl) keyEl.classList.remove('active');
}

keysWrapper.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const keyEl = getKeyAtPoint(touch.clientX, touch.clientY);
    if (keyEl) {
      const midi = parseInt(keyEl.dataset.midi, 10);
      touchMap.set(touch.identifier, midi);
      triggerNoteOn(midi);
    }
  }
}, { passive: false });

keysWrapper.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const prevMidi = touchMap.get(touch.identifier);
    const keyEl = getKeyAtPoint(touch.clientX, touch.clientY);
    if (keyEl) {
      const newMidi = parseInt(keyEl.dataset.midi, 10);
      if (newMidi !== prevMidi) {
        if (prevMidi) triggerNoteOff(prevMidi);
        touchMap.set(touch.identifier, newMidi);
        triggerNoteOn(newMidi);
      }
    } else if (prevMidi) {
      triggerNoteOff(prevMidi);
      touchMap.delete(touch.identifier);
    }
  }
}, { passive: false });

function handleTouchEnd(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const midi = touchMap.get(touch.identifier);
    if (midi) {
      triggerNoteOff(midi);
      touchMap.delete(touch.identifier);
    }
  }
}
keysWrapper.addEventListener('touchend', handleTouchEnd, { passive: false });
keysWrapper.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// Mouse click support for testing
let isMouseDown = false;
let mouseCurrentMidi = null;
keysWrapper.addEventListener('mousedown', (e) => {
  isMouseDown = true;
  const keyEl = getKeyAtPoint(e.clientX, e.clientY);
  if (keyEl) {
    mouseCurrentMidi = parseInt(keyEl.dataset.midi, 10);
    triggerNoteOn(mouseCurrentMidi);
  }
});
window.addEventListener('mouseup', () => {
  if (isMouseDown && mouseCurrentMidi) {
    triggerNoteOff(mouseCurrentMidi);
    mouseCurrentMidi = null;
  }
  isMouseDown = false;
});
keysWrapper.addEventListener('mousemove', (e) => {
  if (!isMouseDown) return;
  const keyEl = getKeyAtPoint(e.clientX, e.clientY);
  if (keyEl) {
    const newMidi = parseInt(keyEl.dataset.midi, 10);
    if (newMidi !== mouseCurrentMidi) {
      if (mouseCurrentMidi) triggerNoteOff(mouseCurrentMidi);
      mouseCurrentMidi = newMidi;
      triggerNoteOn(mouseCurrentMidi);
    }
  }
});

// Simple Metronome
let metroInterval = null;
let metroBpm = 95;
const btnMetronome = document.getElementById('btnMetronome');
btnMetronome.addEventListener('click', () => {
  if (metroInterval) {
    clearInterval(metroInterval);
    metroInterval = null;
    btnMetronome.classList.remove('active');
  } else {
    btnMetronome.classList.add('active');
    const ctx = getAudioContext();
    metroInterval = setInterval(() => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.frequency.value = 880;
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.06);
    }, (60 / metroBpm) * 1000);
  }
});

/* ==========================================================================
   SONG PLAYER & INTERACTIVE LEARN ENGINE
   ========================================================================== */
let currentPlayingSong = null;
let songTimeouts = [];
let isSongPaused = false;
let songStartTime = 0;
let songElapsedTime = 0;
let songInterval = null;

const songStatusBar = document.getElementById('songStatusBar');
const songTitlePlaying = document.getElementById('songTitlePlaying');
const songProgressFill = document.getElementById('songProgressFill');
const songTimeText = document.getElementById('songTimeText');
const btnPauseResumeSong = document.getElementById('btnPauseResumeSong');
const btnStopSong = document.getElementById('btnStopSong');

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function stopSongPlayback() {
  songTimeouts.forEach(t => clearTimeout(t));
  songTimeouts = [];
  if (songInterval) clearInterval(songInterval);
  songInterval = null;
  currentPlayingSong = null;
  isSongPaused = false;
  songElapsedTime = 0;
  songStatusBar.classList.remove('active');
  songProgressFill.style.width = '0%';
  // Clear guide active lights
  const activeGuides = keysWrapper.querySelectorAll('.guide-active');
  activeGuides.forEach(el => el.classList.remove('guide-active'));
}

function startSongPlayback(song, mode = 'play') {
  stopSongPlayback();
  currentPlayingSong = song;
  songTitlePlaying.textContent = (mode === 'learn' ? '🎯 Guide: ' : '▶ Playing: ') + song.title;
  songStatusBar.classList.add('active');

  const totalDuration = song.notes[song.notes.length - 1].t + 2.0;
  songStartTime = Date.now();

  // Check if first note needs octave shift to be visible
  const firstNoteMidi = noteToMidi(song.notes[0].n);
  const firstOct = Math.floor(firstNoteMidi / 12) - 1;
  if (firstOct < baseOctave || firstOct > baseOctave + 1) {
    baseOctave = Math.max(1, Math.min(6, firstOct));
    renderKeyboard();
  }

  songInterval = setInterval(() => {
    if (isSongPaused) return;
    const elapsed = (Date.now() - songStartTime) / 1000;
    songElapsedTime = elapsed;
    const pct = Math.min(100, (elapsed / totalDuration) * 100);
    songProgressFill.style.width = `${pct}%`;
    songTimeText.textContent = `${formatTime(elapsed)} / ${formatTime(totalDuration)}`;

    if (elapsed >= totalDuration) {
      stopSongPlayback();
    }
  }, 100);

  song.notes.forEach(item => {
    const midi = noteToMidi(item.n);
    
    // Play note at scheduled time
    const tOn = setTimeout(() => {
      playNoteSound(midi, 0.85);
      const keyEl = keysWrapper.querySelector(`[data-midi="${midi}"]`);
      if (keyEl) {
        keyEl.classList.add(mode === 'learn' ? 'guide-active' : 'active');
      }
    }, item.t * 1000);

    const tOff = setTimeout(() => {
      stopNoteSound(midi);
      const keyEl = keysWrapper.querySelector(`[data-midi="${midi}"]`);
      if (keyEl) {
        keyEl.classList.remove('active', 'guide-active');
      }
    }, (item.t + item.d) * 1000);

    songTimeouts.push(tOn, tOff);
  });
}

btnStopSong.addEventListener('click', stopSongPlayback);

btnPauseResumeSong.addEventListener('click', () => {
  if (!currentPlayingSong) return;
  isSongPaused = !isSongPaused;
  btnPauseResumeSong.textContent = isSongPaused ? '▶' : '⏸';
  // In a full implementation we pause audio context or schedule offset
  if (isSongPaused) {
    getAudioContext().suspend();
  } else {
    getAudioContext().resume();
  }
});

/* ==========================================================================
   SONGS MODAL UI & SEARCH
   ========================================================================== */
const modalSongLibrary = document.getElementById('modalSongLibrary');
const btnOpenSongs = document.getElementById('btnOpenSongs');
const btnCloseSongModal = document.getElementById('btnCloseSongModal');
const songListContainer = document.getElementById('songListContainer');
const songSearchInput = document.getElementById('songSearchInput');
const modalFilters = document.getElementById('modalFilters');

let currentFilter = 'all';

function renderSongList() {
  songListContainer.innerHTML = '';
  const query = songSearchInput.value.toLowerCase().trim();

  const filtered = INDIAN_SONGS.filter(song => {
    const matchCat = currentFilter === 'all' || song.category === currentFilter;
    const matchQuery = !query ||
      song.title.toLowerCase().includes(query) ||
      song.sub.toLowerCase().includes(query) ||
      song.desc.toLowerCase().includes(query);
    return matchCat && matchQuery;
  });

  filtered.forEach(song => {
    const card = document.createElement('div');
    card.className = 'song-card';
    const totalSec = Math.round(song.notes[song.notes.length - 1].t + 2);
    
    card.innerHTML = `
      <div>
        <div class="song-card-title">${song.title}</div>
        <div class="song-card-sub">${song.sub}</div>
        <div class="song-card-tags">
          <span>⏱️ ${totalSec}s</span> • <span>${song.notes.length} notes</span>
        </div>
      </div>
      <div class="song-card-actions">
        <button class="btn-card btn-card-play" data-action="play" data-id="${song.id}">▶ Auto Play</button>
        <button class="btn-card btn-card-learn" data-action="learn" data-id="${song.id}">🎯 Learn Key</button>
      </div>
    `;

    card.querySelector('[data-action="play"]').addEventListener('click', (e) => {
      e.stopPropagation();
      modalSongLibrary.classList.remove('open');
      startSongPlayback(song, 'play');
    });

    card.querySelector('[data-action="learn"]').addEventListener('click', (e) => {
      e.stopPropagation();
      modalSongLibrary.classList.remove('open');
      startSongPlayback(song, 'learn');
    });

    songListContainer.appendChild(card);
  });
}

btnOpenSongs.addEventListener('click', () => {
  modalSongLibrary.classList.add('open');
  renderSongList();
});

btnCloseSongModal.addEventListener('click', () => {
  modalSongLibrary.classList.remove('open');
});

modalFilters.addEventListener('click', (e) => {
  if (e.target.classList.contains('filter-chip')) {
    modalFilters.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.cat;
    renderSongList();
  }
});

songSearchInput.addEventListener('input', renderSongList);

// Initial keyboard render
renderKeyboard();
